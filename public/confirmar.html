<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar e-mail · RoutProject</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth">
  <aside class="auth-brand" id="brand"></aside>
  <main class="auth-main">
    <form class="auth-card" id="f" novalidate>
      <span class="mobile-logo"></span>
      <div id="passo1">
        <h1>Confirme seu e-mail</h1>
        <p class="lead">Enviamos um código de 6 dígitos para <b id="para"></b>.</p>
        <div class="alert" id="msg" hidden></div>
        <div class="field" id="campoEmail" hidden><label for="email">E-mail</label><input class="input" id="email" type="email" autocomplete="email"></div>
        <div class="code-inputs" aria-label="Código de 6 dígitos">
          <input inputmode="numeric" maxlength="1" aria-label="Dígito 1" autocomplete="one-time-code"><input inputmode="numeric" maxlength="1" aria-label="Dígito 2">
          <input inputmode="numeric" maxlength="1" aria-label="Dígito 3"><input inputmode="numeric" maxlength="1" aria-label="Dígito 4">
          <input inputmode="numeric" maxlength="1" aria-label="Dígito 5"><input inputmode="numeric" maxlength="1" aria-label="Dígito 6">
        </div>
        <button class="btn primary block" id="go">Confirmar</button>
        <p class="alt">Não chegou? Veja a caixa de spam ou <button type="button" class="btn sm" id="reenviar">Reenviar código</button></p>
      </div>
      <div id="passo2" hidden>
        <h1>E-mail confirmado</h1>
        <p class="lead">Seu cadastro foi enviado para aprovação. Você recebe um e-mail assim que o administrador liberar o acesso.</p>
        <a class="btn primary block" href="/">Voltar para o login</a>
      </div>
    </form>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
const msg = RP.$('#msg');
let email = new URLSearchParams(location.search).get('email') || '';
if (email) RP.$('#para').textContent = email; else { RP.$('#para').textContent = 'o seu e-mail'; RP.$('#campoEmail').hidden = false; }
const getEmail = () => email || RP.$('#email').value.trim();
RP.$('#f').addEventListener('submit', (e) => {
  e.preventDefault();
  RP.busy(RP.$('#go'), async () => {
    try {
      await RP.api('/auth/confirmar', { method: 'POST', body: { email: getEmail(), codigo: window.lerCodigo() } });
      RP.$('#passo1').hidden = true; RP.$('#passo2').hidden = false;
    } catch (err) { RP.showAlert(msg, 'err', err.message); }
  });
});
let espera = 0;
const btnR = RP.$('#reenviar');
function tick() { if (espera > 0) { btnR.disabled = true; btnR.textContent = `Reenviar em ${espera}s`; espera--; setTimeout(tick, 1000); } else { btnR.disabled = false; btnR.textContent = 'Reenviar código'; } }
btnR.onclick = async () => {
  try { await RP.api('/auth/reenviar', { method: 'POST', body: { email: getEmail() } }); RP.showAlert(msg, 'ok', 'Se o cadastro estiver pendente, um novo código foi enviado.'); espera = 60; tick(); }
  catch (err) { RP.showAlert(msg, 'err', err.message); }
};
</script>
</body>
</html>
