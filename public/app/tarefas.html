<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarefas · RoutProject</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
</head>
<body>
<script>
// Tarefas: o que está comigo (técnico, coordenação, administrativo) e o que foi delegado ao escritório, numa tela só.
// Cada visão segue a sua permissão: "Comigo" = Minhas atividades; "Delegadas" = Delegadas.
const ST = { a_fazer: 'A fazer', em_andamento: 'Em andamento', aguardando: 'Aguardando', concluida: 'Concluída' };
const PROX = { a_fazer: ['em_andamento', 'Iniciar'], em_andamento: ['concluida', 'Concluir'], aguardando: ['em_andamento', 'Retomar'] };
let S, itens = [], comigo = [], deleg = [], vista = 'comigo', aba = 'abertas', soMinhas = false, pessoaF = '', q = '';
let podeComigo = false, podeDeleg = false;

(async () => {
  S = await Shell.init({ key: 'tarefas', title: 'Tarefas', sub: 'O que está com você e o que foi delegado ao escritório' });
  if (S.user.perfil === 'cliente') { S.content.innerHTML = '<div class="card empty">O acesso de cliente ainda está em preparação.</div>'; return; }
  podeComigo = Shell.pode('minhas'); podeDeleg = Shell.pode('delegadas');
  const pedido = new URLSearchParams(location.search).get('f');
  vista = pedido === 'delegadas' && podeDeleg ? 'delegadas' : podeComigo ? 'comigo' : 'delegadas';
  soMinhas = S.user.perfil === 'administrativo';
  carregar();
})();

async function carregar() {
  [comigo, deleg] = await Promise.all([
    podeComigo ? RP.api('/minhas-tarefas').catch(() => []) : [],
    podeDeleg ? RP.api('/delegadas' + (soMinhas ? '?minhas=1' : '')).catch(() => []) : [],
  ]);
  itens = vista === 'comigo' ? comigo : deleg;
  render();
}

function render() {
  history.replaceState(null, '', '/app/tarefas.html' + (vista === 'delegadas' ? '?f=delegadas' : ''));
  itens = vista === 'comigo' ? comigo : deleg;
  const abertas = (l) => l.filter((t) => t.status !== 'concluida').length;
  const chips = [podeComigo && ['comigo', 'Comigo', abertas(comigo)], podeDeleg && ['delegadas', 'Delegadas ao escritório', abertas(deleg)]].filter(Boolean);
  const topo = chips.length > 1 ? `<div class="vtabs" role="tablist" aria-label="Quais tarefas" style="margin:0">${chips.map(([k, t, n]) => `<button type="button" role="tab" class="eqc" data-v="${k}" aria-pressed="${vista === k}">${t} <small>${n} em aberto</small></button>`).join('')}</div>` : '';
  S.actions.innerHTML = vista === 'delegadas' ? `<label class="check" style="margin:0"><input type="checkbox" id="sominhas" ${soMinhas ? 'checked' : ''}> Só as minhas</label>` : '';
  RP.$('#sominhas')?.addEventListener('change', (e) => { soMinhas = e.target.checked; carregar(); });
  if (vista === 'comigo') renderComigo(topo); else renderDelegadas(topo);
  RP.$$('[data-v]', S.content).forEach((b) => (b.onclick = () => { vista = b.dataset.v; render(); }));
}

function renderComigo(topo) {
  const ab = itens.filter((t) => t.status !== 'concluida');
  const vis = aba === 'abertas' ? ab : itens.filter((t) => t.status === 'concluida');
  S.content.innerHTML = `${topo}
    <div class="alert info" style="margin:0">No celular, use o <a href="/m/"><b>App do técnico</b></a>: checklist, fotos e funcionamento sem internet.</div>
    <div class="card">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="${aba === 'abertas'}" data-a="abertas">Em aberto (${ab.length})</button>
        <button role="tab" aria-selected="${aba === 'feitas'}" data-a="feitas">Concluídas (${itens.length - ab.length})</button>
      </div>
      ${vis.length ? `<div>${vis.map((t) => `<div class="row click" data-abre="${t.id}" style="padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer">
          <div style="flex:1;min-width:200px"><b>${RP.esc(t.atividade)}</b><div class="muted" style="font-size:.9rem">${RP.esc(t.endereco)} · ${RP.esc(t.municipio)}/${t.uf} · ${t.cameras} câmeras</div>
            <div class="muted" style="font-size:.85rem">${RP.esc(t.cliente)}${t.prevista_inicio ? ' · previsto ' + RP.fmtData(t.prevista_inicio) : ''}</div></div>
          <span class="pill ${t.status}"><i></i>${ST[t.status]}</span>
          ${PROX[t.status] ? `<button class="btn sm primary" data-id="${t.id}" data-s="${PROX[t.status][0]}">${PROX[t.status][1]}</button>` : ''}
          ${t.status === 'em_andamento' ? `<button class="btn sm" data-id="${t.id}" data-s="aguardando">Pausar</button>` : ''}
        </div>`).join('')}</div>` : `<div class="empty">${aba === 'abertas' ? 'Nenhuma tarefa com você agora.' : 'Nada concluído ainda.'}</div>`}
    </div>`;
  RP.$$('[data-a]', S.content).forEach((b) => (b.onclick = () => { aba = b.dataset.a; render(); }));
  RP.$$('[data-abre]', S.content).forEach((r) => (r.onclick = () => abrir(+r.dataset.abre)));
  RP.$$('[data-s]', S.content).forEach((b) => (b.onclick = (ev) => { ev.stopPropagation(); RP.busy(b, async () => {
    try { await RP.api('/tarefas/' + b.dataset.id, { method: 'PATCH', body: { status: b.dataset.s } }); RP.toast('Status atualizado'); await carregar(); }
    catch (e) { RP.toast(e.message); }
  }); }));
}

function renderDelegadas(topo) {
  const pessoas = [...new Map(itens.map((t) => [t.responsavel_id, t.responsavel])).entries()];
  const lq = q.toLowerCase();
  const vis = itens.filter((t) => (!pessoaF || String(t.responsavel_id) === pessoaF) && (!lq || (t.atividade + ' ' + t.endereco + ' ' + t.municipio + ' ' + t.cliente).toLowerCase().includes(lq)));
  const cont = (s) => vis.filter((t) => t.status === s).length;
  S.content.innerHTML = `${topo}
    <div class="kpis">${Object.entries(ST).map(([k, v]) => `<div class="kpi"><span>${v}</span><b>${RP.fmtN(cont(k))}</b></div>`).join('')}</div>
    <div class="toolbar">
      <input class="input" id="q" placeholder="Buscar atividade, endereço ou cliente" value="${RP.esc(q)}" aria-label="Buscar">
      ${soMinhas ? '' : `<select class="input" id="pf" style="max-width:240px" aria-label="Responsável"><option value="">Todas as pessoas</option>${pessoas.map(([id, n]) => `<option value="${id}" ${String(id) === pessoaF ? 'selected' : ''}>${RP.esc(n)}</option>`).join('')}</select>`}
    </div>
    ${vis.length ? `<div class="kanban">${Object.entries(ST).map(([k, v]) => {
      const col = vis.filter((t) => t.status === k);
      return `<section class="kcol" aria-label="${v}"><h3><span class="pill ${k}"><i></i>${v}</span><span class="muted" style="font-size:.9rem">${col.length}</span></h3>
        ${col.slice(0, 80).map((t) => `<button class="kcard" data-id="${t.id}"><b>${RP.esc(t.atividade)}</b>
          <span class="meta">${RP.esc(t.endereco)} · ${RP.esc(t.municipio)}/${t.uf}</span>
          <span class="meta">${RP.esc(t.cliente)} · ${RP.esc(t.contrato)}</span>
          <span class="row" style="gap:6px"><span class="avatar" style="width:24px;height:24px;font-size:.7rem">${RP.esc(RP.iniciais(t.responsavel))}</span><span class="meta">${RP.esc(t.responsavel)}${t.prevista_fim ? ' · até ' + RP.fmtData(t.prevista_fim) : ''}</span></span></button>`).join('')}
        ${col.length > 80 ? `<div class="muted" style="text-align:center">+ ${col.length - 80} — use a busca</div>` : ''}</section>`;
    }).join('')}</div>` : '<div class="card empty">Nada delegado por aqui. Na Execução do projeto, envie atividades como o handover para alguém do administrativo.</div>'}`;
  const q$ = RP.$('#q'); q$.oninput = () => { q = q$.value; clearTimeout(q$._t); q$._t = setTimeout(() => { render(); RP.$('#q').focus(); }, 250); };
  RP.$('#pf')?.addEventListener('change', (e) => { pessoaF = e.target.value; render(); });
  RP.$$('.kcard', S.content).forEach((b) => (b.onclick = () => abrir(+b.dataset.id)));
}

async function abrir(id) {
  const t = itens.find((x) => x.id === id);
  const d = RP.drawer(t.atividade, `
    <p class="muted" style="margin-top:0">${RP.esc(t.endereco)} · ${RP.esc(t.municipio)}/${t.uf}<br>${RP.esc(t.cliente)} · ${RP.esc(t.contrato)} · status do endereço: ${RP.esc(t.endereco_status)}</p>
    ${t.evidencia ? `<div class="alert info">Evidência esperada: ${RP.esc(t.evidencia)}</div>` : ''}
    <div class="row" style="gap:8px;margin-bottom:14px"><a class="btn sm ${t.status === 'concluida' ? 'primary' : ''}" href="/api/tarefas/${t.id}/relatorio.pdf" target="_blank" rel="noopener">${t.status === 'concluida' ? 'Relatório final (PDF)' : 'Relatório parcial (PDF)'}</a></div>
    <h3 style="font-size:1.05rem;margin:4px 0 8px">Checklist</h3><div id="d-ck" class="muted">Carregando…</div>
    <div class="field"><label for="d-st">Status</label><select class="input" id="d-st" ${t.status === 'concluida' && !Shell.acao('reabrir') ? 'disabled title="Só a coordenação ou a supervisão reabre atividade concluída"' : ''}>${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${k === t.status ? 'selected' : ''}>${v}</option>`).join('')}</select>${t.status === 'concluida' ? `<small>${Shell.acao('reabrir') ? 'Concluída. Para reabrir, escolha outro status (fica registrado no histórico).' : '🔒 Concluída. Só a coordenação ou a supervisão pode reabrir.'}</small>` : ''}</div>
    <div class="field"><label for="d-c">Comentário</label><textarea class="input" id="d-c" placeholder="Ex.: termo enviado ao gerente, aguardando assinatura"></textarea></div>
    <h3 style="font-size:1.05rem;margin:18px 0 8px">Fotos</h3><div id="d-fotos" class="muted">Carregando…</div>
    <h3 style="font-size:1.05rem;margin:18px 0 8px">Histórico</h3><div id="d-h" class="muted">Carregando…</div>`, {
    onSave: async (el) => {
      const s = RP.$('#d-st', el).value;
      if (s !== t.status) await RP.api('/tarefas/' + id, { method: 'PATCH', body: { status: s } });
      const c = RP.$('#d-c', el).value.trim();
      if (c) await RP.api(`/tarefas/${id}/comentarios`, { method: 'POST', body: { texto: c } });
      RP.toast('Tarefa atualizada'); carregar();
    },
  });
  RP.api(`/tarefas/${id}/checklist`).then((c) => { RP.$('#d-ck', d.el).innerHTML = RP.checklistHtml(c); }).catch(() => { RP.$('#d-ck', d.el).textContent = ''; });
  const ev = await RP.api(`/tarefas/${id}/eventos`);
  RP.api(`/tarefas/${id}/fotos`).then((fs) => {
    RP.$('#d-fotos', d.el).innerHTML = fs.length ? `<div class="row" style="gap:8px">${fs.map((f) => `<a href="/api/fotos/${f.id}" target="_blank" rel="noopener" title="${RP.esc((f.item || f.legenda || 'Foto') + ' · ' + RP.fmtDataHora(f.tirada_em || f.criado_em))}"><img src="/api/fotos/${f.id}" alt="${RP.esc(f.item || f.legenda || 'Foto')}" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)" loading="lazy"></a>`).join('')}</div>` : 'Nenhuma foto enviada pelo app ainda.';
  }).catch(() => { RP.$('#d-fotos', d.el).textContent = ''; });
  RP.$('#d-h', d.el).innerHTML = ev.length ? ev.map((x) => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b style="color:var(--ink)">${RP.esc(x.usuario || 'Sistema')}</b> · ${RP.fmtDataHora(x.criado_em)}<br>${RP.esc(x.detalhe)}</div>`).join('') : 'Sem movimentações.';
}
</script>
</body>
</html>
