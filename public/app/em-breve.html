<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Em breve · RoutProject</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
</head>
<body>
<script>
(async () => {
  const t = new URLSearchParams(location.search).get('t') || 'Em breve';
  const key = { Faturamento: 'faturamento', Chat: 'chat' }[t] || '';
  const s = await Shell.init({ key, title: t, sub: 'Próxima etapa do desenvolvimento' });
  const txt = {
    Faturamento: 'Medições por mês, regra de cobrança por contrato, NF emitida e recebida. As tabelas medicoes e medicao_enderecos já existem no banco.',
    Chat: 'Conversa entre times de campo e escritório, com pedidos e ocorrências por endereço. A tabela mensagens já existe no banco.',
  }[t] || 'Esta tela está no protótipo e entra numa próxima versão.';
  s.content.innerHTML = `<div class="card empty"><h2 style="margin-bottom:8px">${RP.esc(t)} chega na próxima versão</h2><p>${RP.esc(txt)}</p></div>`;
})();
</script>
</body>
</html>
