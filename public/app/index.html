<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoutProject</title>

<script src="/js/api.js"></script>

<body>
<script>
RP.api('/auth/me')
  .then((r) => location.replace(r.usuario.perfil !== 'admin' && (!r.usuario.permissoes || !r.usuario.permissoes.rota || r.usuario.permissoes.rota === 'nenhum') ? '/app/minhas.html' : '/app/rota.html'))
  .catch(() => location.replace('/'));
</script>
