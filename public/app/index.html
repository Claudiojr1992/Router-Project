<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoutProject</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/js/api.js"></script>
</head>
<body>
<script>
RP.api('/auth/me')
  .then((r) => { const u = r.usuario, p = u.permissoes || {}; const ve = (m) => p[m] && p[m] !== 'nenhum';
    location.replace(u.perfil === 'admin' || ve('rota') || ve('projetos') || ve('clientes') ? '/app/projetos.html' : '/app/tarefas.html'); })
  .catch(() => location.replace('/'));
</script>
</body>
</html>
