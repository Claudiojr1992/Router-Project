<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes · RoutProject</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/planilha.js"></script>
<script src="/js/historico.js"></script>
</head>
<body>
<script>
const UFS = 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
let S, cli = null, aba = 'enderecos', contratoSel = null, ends = [], q = '', itensCt = [], etapasCli = [], fEtapa = '', fEquipe = '', vista = 'abertos', regrasInfo = { itens: [], regras: [] };
let empresas = [], prep = null;
let guiaAberto = (() => { try { return localStorage.getItem('rp-guia') !== '0'; } catch (_) { return true; } })();
let verItens = (() => { try { return localStorage.getItem('rp-ver-itens') === '1'; } catch (_) { return false; } })();
// quantidade de um item do contrato no endereço (Câmera sem item cadastrado usa o campo câmeras)
const qtdItem = (e, nome) => { const it = (e.itens || []).find((x) => normTxt(x.nome) === normTxt(nome)); return it ? it.quantidade : (ehCamera(nome) ? e.cameras || 0 : 0); };
const DIAS_SEM = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'], DIAS_NOME = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const fmtDias = (n) => String(+n).replace('.', ',');
// Equipes: cores iguais às do Painel de rotas
const COR_EQ = ['#2F6FD0', '#D9622B', '#22955F', '#B0399A', '#B88A0A', '#14909F', '#D23E5A', '#6F55C8'];
const corEq = (t) => COR_EQ[(t - 1) % 8];
const hoje = () => new Date().toLocaleDateString('sv');
const PRE_EXEC = ['A iniciar', 'Configurado', 'Em transporte', 'Material entregue'];
const concluido = (e) => !!e.concluido_em;
// Atrasado: devia ter começado (início previsto já passou) e ainda não entrou em execução
const atrasado = (e) => !concluido(e) && e.inicio_previsto && String(e.inicio_previsto).slice(0, 10) < hoje() && PRE_EXEC.includes(e.status);
const dBr = (d2) => (d2 ? String(d2).slice(0, 10).split('-').reverse().join('/') : '');
const dCurta = (d2) => (d2 ? String(d2).slice(0, 10).split('-').reverse().slice(0, 2).join('/') : '');
const SUGESTOES = ['Câmera', 'Servidor / NVR', 'Switch PoE', 'Nobreak', 'HD', 'Rack', 'Monitor', 'Licença', 'Patch panel', 'Cabo UTP (m)', 'Fonte', 'Conector RJ45'];
const ehCamera = (n) => /^cameras?\b/.test(normTxt(n));
const resumoItens = (its) => (its || []).filter((i) => i.quantidade > 0).map((i) => `${RP.esc(i.nome)} ${i.quantidade}`).join(' · ');

// Editor de linhas de equipamentos (nome digitável com sugestões + quantidade opcional + remover)
function linhaItem(it = {}, comQtd = true) {
  return `<div class="row itrow" style="margin-bottom:8px;flex-wrap:nowrap"><input class="input it-n" list="dl-itens" placeholder="Ex.: Switch PoE" value="${RP.esc(it.nome || '')}" aria-label="Equipamento">
    ${comQtd ? `<input class="input it-q" type="number" min="0" step="1" style="max-width:100px" placeholder="Qtd." value="${it.quantidade ?? ''}" aria-label="Quantidade">` : ''}
    <button class="x" type="button" aria-label="Remover equipamento">×</button></div>`;
}
function editorItens(el, linhas, comQtd = true) {
  const box = RP.$('.itbox', el);
  const sug = [...new Set([...itensCt.map((i) => i.nome), ...SUGESTOES])];
  box.innerHTML = `<datalist id="dl-itens">${sug.map((n) => `<option value="${RP.esc(n)}">`).join('')}</datalist>` + linhas.map((l) => linhaItem(l, comQtd)).join('');
  const bind = () => RP.$$('.itrow .x', box).forEach((b) => (b.onclick = () => b.closest('.itrow').remove()));
  RP.$('.itadd', el).onclick = () => { box.insertAdjacentHTML('beforeend', linhaItem({}, comQtd)); bind(); box.lastElementChild.querySelector('.it-n').focus(); };
  bind();
}
const lerItens = (el) => RP.$$('.itrow', el).map((r) => ({ nome: r.querySelector('.it-n').value.trim(), quantidade: r.querySelector('.it-q') ? (r.querySelector('.it-q').value === '' ? 0 : +r.querySelector('.it-q').value) : 0 })).filter((i) => i.nome);
const f = (id, label, val = '', extra = '') => `<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" value="${RP.esc(val ?? '')}" ${extra}></div>`;
const val = (el, id) => RP.$('#' + id, el).value;

(async () => {
  S = await Shell.init({ key: 'clientes', title: 'Clientes e contratos', sub: 'Clientes, contratos e os endereços de cada contrato', perfis: Shell.ESC });
  empresas = await RP.api('/empresas').catch(() => []);
  const qs = new URLSearchParams(location.search);
  const id = qs.get('id');
  if (['enderecos', 'contratos', 'dados'].includes(qs.get('aba'))) aba = qs.get('aba');
  if (id) abrir(+id); else lista();
})();

async function lista() {
  history.replaceState(null, '', '/app/clientes.html');
  cli = null;
  S.sub.textContent = 'Clientes, contratos e os endereços de cada contrato';
  S.actions.innerHTML = '<button class="btn sm primary" id="novo">+ Novo cliente</button>';
  RP.$('#novo').onclick = novoCliente;
  const cs = await RP.api('/clientes');
  S.content.innerHTML = cs.length ? `<div class="grid2">${cs.map((c) => `<button class="card ccard" data-id="${c.id}">
      <div class="row"><span class="avatar" style="border-radius:10px">${RP.esc(RP.iniciais(c.nome))}</span><div><h3>${RP.esc(c.nome)}</h3><div class="muted" style="font-size:.88rem">${RP.esc(c.razao_social || '')}</div></div></div>
      <div class="row muted" style="font-size:.9rem"><span>${c.contratos} contrato(s)</span>·<span>${RP.fmtN(c.enderecos)} endereços</span>·<span>${RP.fmtN(c.cameras)} câmeras</span></div>
      <div class="row"><div class="bar" style="flex:1"><i style="width:${c.enderecos ? Math.round(c.concluidos / c.enderecos * 100) : 0}%"></i></div><span class="muted" style="font-size:.85rem">${c.concluidos} concluídos</span></div>
    </button>`).join('')}</div>` : '<div class="card empty">Nenhum cliente ainda. Use “+ Novo cliente”.</div>';
  RP.$$('.ccard', S.content).forEach((b) => (b.onclick = () => abrir(+b.dataset.id)));
}

async function carregarContrato() {
  if (contratoSel) [ends, itensCt, prep] = await Promise.all([RP.api(`/contratos/${contratoSel}/enderecos`), RP.api(`/contratos/${contratoSel}/itens`), RP.api(`/contratos/${contratoSel}/preparacao`).catch(() => null)]);
  else { ends = []; itensCt = []; prep = null; }
  [etapasCli, regrasInfo] = cli ? await Promise.all([RP.api(`/clientes/${cli.id}/etapas`), RP.api(`/clientes/${cli.id}/equipe-regras`)]) : [[], { itens: [], regras: [] }];
}

async function abrir(id) {
  cli = await RP.api('/clientes/' + id);
  history.replaceState(null, '', '/app/clientes.html?id=' + id);
  S.sub.textContent = cli.razao_social || cli.nome;
  S.actions.innerHTML = '<button class="btn sm" id="voltar">← Todos os clientes</button>';
  RP.$('#voltar').onclick = lista;
  if (!contratoSel || !cli.contratos.some((c) => c.id === contratoSel)) contratoSel = cli.contratos[0]?.id || null;
  await carregarContrato();
  render();
}

function render() {
  const tot = cli.contratos.reduce((s, c) => s + c.enderecos, 0), cam = cli.contratos.reduce((s, c) => s + c.cameras, 0);
  S.content.innerHTML = `
    <div class="card"><div class="body row" style="gap:16px">
      <span class="avatar" style="width:54px;height:54px;border-radius:12px;font-size:1.2rem">${RP.esc(RP.iniciais(cli.nome))}</span>
      <div style="flex:1"><h2 style="font-size:1.6rem">${RP.esc(cli.nome)}</h2><div class="muted">${RP.esc(cli.cnpj || 'CNPJ não informado')} · ${RP.esc(cli.segmento || '')}</div></div>
      <div class="kpi" style="min-width:130px"><span>Endereços</span><b>${RP.fmtN(tot)}</b></div><div class="kpi" style="min-width:130px"><span>Câmeras</span><b>${RP.fmtN(cam)}</b></div>
    </div>
    <div class="tabs" role="tablist">${[['enderecos', 'Endereços'], ['contratos', 'Contratos'], ['dados', 'Dados']].map(([k, v]) => `<button role="tab" aria-selected="${aba === k}" data-a="${k}">${v}</button>`).join('')}</div>
    <div id="tab"></div></div>`;
  RP.$$('[data-a]', S.content).forEach((b) => (b.onclick = () => { aba = b.dataset.a; render(); }));
  ({ enderecos: tabEnderecos, contratos: tabContratos, dados: tabDados })[aba](RP.$('#tab'));
}

function tabEnderecos(el) {
  if (!cli.contratos.length) {
    el.innerHTML = `<div class="empty"><p style="margin:0 0 6px"><b>Primeiro crie o contrato deste cliente.</b></p>
      <p style="margin:0 0 14px">Os endereços e as atividades ficam ligados a um contrato (principal ou aditivo).</p>
      <button class="btn primary" id="primeiroContrato">+ Criar contrato</button></div>`;
    RP.$('#primeiroContrato', el).onclick = () => contrato(null);
    return;
  }
  const lq = q.toLowerCase();
  const nEq = cli.equipes || 0;
  const abertos = ends.filter((e) => !concluido(e)), feitos = ends.filter(concluido);
  const foraR = ends.filter((e) => e.na_rota === false);
  const base = vista === 'concluidos' ? feitos : vista === 'abertos' ? abertos : vista === 'fora' ? foraR : ends;
  const vis = base.filter((e) => (!lq || (e.nome + ' ' + e.municipio + ' ' + (e.codigo || '')).toLowerCase().includes(lq))
    && (!fEtapa || (fEtapa === 'sem' ? !e.etapa_id : String(e.etapa_id) === fEtapa))
    && (!fEquipe || (fEquipe === 'sem' ? !e.equipe : fEquipe === 'atraso' ? atrasado(e) : String(e.equipe) === fEquipe)))
    .sort((a, b) => vista === 'concluidos' ? String(b.concluido_em).localeCompare(String(a.concluido_em))
      : (fEquipe && fEquipe !== 'sem') || (fEtapa && fEtapa !== 'sem')
        ? (String(a.inicio_previsto || '9').localeCompare(String(b.inicio_previsto || '9')) || ((a.ordem_etapa || 1e9) - (b.ordem_etapa || 1e9))) : 0);
  // resumo das equipes (endereços em aberto deste contrato)
  const porEq = [...Array(nEq).keys()].map((i) => { const l = abertos.filter((e) => e.equipe === i + 1); const ini = l.map((e) => e.inicio_previsto).filter(Boolean).sort();
    return { t: i + 1, n: l.length, ini: ini[0], fim: ini[ini.length - 1], atr: l.filter(atrasado).length }; });
  const semEq = abertos.filter((e) => !e.equipe).length, nAtr = abertos.filter(atrasado).length;
  const chip = (v, html, extra = '') => `<button type="button" class="eqc" data-feq="${v}" aria-pressed="${fEquipe === v}" ${extra}>${html}</button>`;
  el.innerHTML = `${guia(abertos)}<div class="eqbar">
      <span class="lbl">Equipes</span>
      <select class="input" id="neq" style="width:auto;min-width:130px" aria-label="Quantidade de equipes do projeto">
        <option value="">Sem equipes</option>${[1, 2, 3, 4, 5, 6, 7, 8].map((n) => `<option value="${n}" ${n === nEq ? 'selected' : ''}>${n} equipe${n > 1 ? 's' : ''}</option>`).join('')}</select>
      ${porEq.map((x) => chip(String(x.t), `<i style="--c:${corEq(x.t)}"></i><b>Equipe ${x.t}</b> <small>${resumoRegra(x.t) ? resumoRegra(x.t) + ' · ' : ''}${x.n} end.${x.ini ? ` · início ${dCurta(x.ini)}${x.fim && x.fim !== x.ini ? ' → ' + dCurta(x.fim) : ''}` : ''}${x.atr ? ` · <span class="tag-late">${x.atr} atrasado(s)</span>` : ''}</small>`)).join('')}
      ${nEq ? chip('sem', `<i></i>Sem equipe <small>${semEq}</small>`) : ''}
      ${nAtr ? chip('atraso', `<span class="tag-late">⚠ ${nAtr} atrasado(s)</span>`) : ''}
      <span class="spacer"></span>
      <div class="plano-grp" role="group" aria-label="Planejamento do projeto"><span class="lbl">Planejamento</span>
      <button class="btn sm" id="etp" title="Etapas do projeto: mês e data de início">Etapas (${etapasCli.length})</button>
      <button class="btn sm" id="rgq" title="Dias de trabalho e quantidade de cada equipamento por dia, por equipe">Regras das equipes</button>
      <button class="btn sm primary" id="dist" title="Distribui os endereços não concluídos entre as equipes e calcula início e fim de cada um">Distribuir equipes e datas</button></div>
    </div>
    <div class="vtabs" role="tablist">${[['abertos', `A atacar (${abertos.length})`], ['concluidos', `Concluídos (${feitos.length})`], ['todos', `Todos (${ends.length})`], ...(foraR.length || vista === 'fora' ? [['fora', `Fora da rota (${foraR.length})`]] : [])].map(([k2, t]) => `<button type="button" role="tab" class="eqc" data-vista="${k2}" aria-pressed="${vista === k2}">${t}</button>`).join('')}</div>
    <div class="toolbar" style="padding:12px 16px">
      <select class="input" id="ct" style="max-width:240px" aria-label="Contrato">${cli.contratos.map((c) => `<option value="${c.id}" ${c.id === contratoSel ? 'selected' : ''}>${RP.esc(c.numero)} (${c.enderecos})</option>`).join('')}</select>
      <input class="input" id="q" placeholder="Buscar endereço" value="${RP.esc(q)}" aria-label="Buscar" style="max-width:240px">
      <select class="input" id="fet" style="max-width:190px" aria-label="Etapa"><option value="">Todas as etapas</option><option value="sem" ${fEtapa === 'sem' ? 'selected' : ''}>Sem etapa</option>
        ${etapasCli.map((t) => `<option value="${t.id}" ${String(t.id) === fEtapa ? 'selected' : ''}>${RP.esc(t.nome)} · ${RP.fmtData(t.data_inicio)}</option>`).join('')}</select>
      <span class="spacer"></span>
      <details class="mais"><summary class="btn sm" title="Ações com os endereços listados, itens e exportação">Mais ações</summary><div class="mais-menu" role="menu">
        ${vis.length && vista !== 'concluidos' ? `<button type="button" role="menuitem" id="mvet">Alterar os ${vis.length} listados<small>Etapa, equipe, início ou rota de uma vez</small></button>` : ''}
        <button type="button" role="menuitem" id="vit" aria-pressed="${verItens}">${verItens ? 'Ocultar colunas dos itens' : 'Mostrar uma coluna por item'}<small>Câmera, servidor, switch… lado a lado</small></button>
        <button type="button" role="menuitem" id="itp">Itens do projeto (${itensCt.length})<small>Equipamentos deste contrato</small></button>
        <button type="button" role="menuitem" id="exp">Exportar endereços<small>Excel ou CSV</small></button>
        ${vis.length && podeExcluir() ? `<button type="button" role="menuitem" class="perigo" id="delv">Excluir os ${vis.length} listados</button>` : ''}
      </div></details>
      <button class="btn sm" id="imp">Importar planilha</button><button class="btn sm primary" id="ne">+ Endereço</button></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Código</th><th>Endereço</th><th>Município</th><th>UF</th><th>Etapa</th><th>Equipe</th><th>${vista === 'concluidos' ? 'Concluído em' : 'Início'}</th>${verItens ? itensCt.map((i) => `<th style="text-align:right">${RP.esc(i.nome)}</th>`).join('') : '<th>Equipamentos</th>'}<th>Status</th><th title="Marcado = entra no Painel de rotas e na distribuição">Rota</th></tr></thead>
    <tbody>${vis.map((e) => `<tr class="click" data-id="${e.id}"><td>${RP.esc(e.codigo || '—')}</td><td><b>${RP.esc(e.nome)}</b>${e.na_rota === false ? ' <span class="tag-fora">fora da rota</span>' : ''}${e.logradouro ? `<div class="muted" style="font-size:.82rem">${RP.esc(e.logradouro)}</div>` : ''}</td><td>${RP.esc(e.municipio)}</td><td>${e.uf}</td><td style="white-space:nowrap">${e.etapa ? `${RP.esc(e.etapa)}${e.ordem_etapa ? ` · <b>${e.ordem_etapa}º</b>` : ''}<div class="muted" style="font-size:.78rem">início ${RP.fmtData(e.etapa_inicio)}</div>` : '<span class="muted">—</span>'}</td>
      <td style="white-space:nowrap">${e.equipe ? `<span class="eqdot" style="--c:${corEq(e.equipe)}"></span>Equipe ${e.equipe}` : '<span class="muted">—</span>'}</td>
      <td style="white-space:nowrap">${concluido(e) ? `<b style="color:var(--ok)">✓ ${dBr(e.concluido_em)}</b>${vista !== 'abertos' ? ` <button type="button" class="btn sm" data-reabrir="${e.id}" title="Apaga a data de conclusão e devolve o endereço para a rota">Retornar</button>` : ''}`
        : e.inicio_previsto ? `${dBr(e.inicio_previsto)}${e.fim_previsto && e.fim_previsto !== e.inicio_previsto ? ' → ' + dCurta(e.fim_previsto) : ''}${e.dias_previstos ? `<div class="muted" style="font-size:.78rem">${fmtDias(e.dias_previstos)} dia(s)</div>` : ''}${atrasado(e) ? '<div class="tag-late">⚠ atrasado</div>' : ''}` : (e.dias_previstos ? `<span class="muted" style="font-size:.82rem">${fmtDias(e.dias_previstos)} dia(s)</span>` : '<span class="muted">—</span>')}</td>
      ${verItens ? itensCt.map((i) => { const q = qtdItem(e, i.nome); return `<td style="text-align:right">${q ? `<b>${RP.fmtN(q)}</b>` : '<span class="muted">—</span>'}</td>`; }).join('') : `<td class="muted" style="font-size:.85rem;max-width:280px">${resumoItens(e.itens) || '—'}</td>`}<td>${RP.esc(e.status)}</td><td><label class="rtog" title="${e.na_rota === false ? 'Fora da rota: clique para incluir' : 'Na rota: clique para tirar'}"><input type="checkbox" data-rota="${e.id}" ${e.na_rota === false ? '' : 'checked'} aria-label="${RP.esc(e.nome)} vai para a rota"><span></span></label></td></tr>`).join('')}</tbody>
    ${verItens && vis.length ? `<tfoot><tr><td colspan="7"><b>Total dos ${vis.length} listados</b></td>${itensCt.map((i) => `<td style="text-align:right"><b>${RP.fmtN(vis.reduce((a, e) => a + qtdItem(e, i.nome), 0))}</b></td>`).join('')}<td></td><td></td></tr></tfoot>` : ''}</table>
    ${vis.length ? '' : `<div class="empty">${vista === 'concluidos' ? 'Nenhum endereço concluído. Para concluir, abra o endereço e informe a <b>Data de conclusão</b>.' : 'Nenhum endereço.'}</div>`}</div>`;
  RP.$('#ct', el).onchange = async (e) => { contratoSel = +e.target.value; await carregarContrato(); render(); };
  const q$ = RP.$('#q', el); q$.oninput = () => { q = q$.value; clearTimeout(q$._t); q$._t = setTimeout(() => { render(); RP.$('#q').focus(); }, 250); };
  RP.$('#ne', el).onclick = () => endereco(null);
  RP.$('#imp', el).onclick = importar;
  ligarGuia(el);
  RP.$$('.mais-menu button', el).forEach((b) => b.addEventListener('click', () => b.closest('details').removeAttribute('open')));
  RP.$('#exp', el).onclick = exportar;
  RP.$('#itp', el).onclick = () => itensProjeto(contratoSel);
  RP.$('#etp', el).onclick = etapasProjeto;
  RP.$('#vit', el).onclick = () => { verItens = !verItens; try { localStorage.setItem('rp-ver-itens', verItens ? '1' : '0'); } catch (_) { /* sem armazenamento */ } render(); };
  RP.$('#fet', el).onchange = (ev) => { fEtapa = ev.target.value; render(); };
  RP.$('#mvet', el)?.addEventListener('click', () => alterarListados(vis));
  RP.$('#delv', el)?.addEventListener('click', () => excluirEnderecos(vis));
  RP.$$('[data-feq]', el).forEach((b) => (b.onclick = () => { fEquipe = fEquipe === b.dataset.feq ? '' : b.dataset.feq; if (fEquipe === 'atraso') vista = 'abertos'; render(); }));
  RP.$$('[data-vista]', el).forEach((b) => (b.onclick = () => { vista = b.dataset.vista; render(); }));
  RP.$('#neq', el).onchange = (ev) => mudarEquipes(ev.target.value);
  RP.$('#dist', el).onclick = distribuir;
  RP.$('#rgq', el).onclick = regrasEquipes;
  RP.$$('[data-reabrir]', el).forEach((b) => (b.onclick = async (ev) => {
    ev.stopPropagation();
    try { await RP.api(`/enderecos/${b.dataset.reabrir}/conclusao`, { method: 'POST', body: { data: null } }); RP.toast('Endereço de volta à rota'); await carregarContrato(); render(); }
    catch (e2) { RP.toast(e2.message); }
  }));
  RP.$$('.rtog', el).forEach((l) => (l.onclick = (ev) => ev.stopPropagation()));
  RP.$$('[data-rota]', el).forEach((cb) => (cb.onchange = async () => {
    const e = ends.find((x) => x.id === +cb.dataset.rota);
    try { await RP.api('/enderecos/lote-plano', { method: 'POST', body: { endereco_ids: [e.id], na_rota: cb.checked } }); e.na_rota = cb.checked;
      RP.toast(cb.checked ? `${e.nome} volta para a rota` : `${e.nome} fora da rota`); render(); }
    catch (e2) { cb.checked = !cb.checked; RP.toast(e2.message); }
  }));
  RP.$$('tr.click', el).forEach((r) => (r.onclick = () => endereco(ends.find((e) => e.id === +r.dataset.id))));
}

// ---------- Preparação do projeto: os passos que faltam, cada um com o botão que resolve ----------
function passosPrep(abertos) {
  const nEq = cli.equipes || 0;
  const semPlano = abertos.filter((e) => e.na_rota !== false && (!e.equipe || !e.inicio_previsto)).length;
  const ct = cli.contratos.find((c) => c.id === contratoSel);
  return [

function guia(abertos) {

    <div class="guia-fim"><span class="muted">Depois de pronto, acompanhe por aqui:</span>${fim}</div></details>`;

function ligarGuia(el) {
  const g = RP.$('details.guia', el);
  if (g) g.addEventListener('toggle', () => { guiaAberto = g.open; try { localStorage.setItem('rp-guia', g.open ? '1' : '0'); } catch (_) { /* sem armazenamento */ } });

}

  codigo: ['codigo', 'cod', 'cód', 'código', 'id', 'prefixo'], nome: ['nome', 'agencia', 'agência', 'unidade', 'local', 'endereco nome'],
  logradouro: ['logradouro', 'endereco', 'endereço', 'rua'], bairro: ['bairro'], cep: ['cep'],

  ordem_etapa: ['ordem', 'ordem na etapa', 'sequencia', 'sequência', 'prioridade'],

  concluido_em: ['conclusao', 'conclusão', 'data de conclusao', 'data de conclusão', 'concluido em', 'concluído em', 'data conclusao'],

  entrega_material: ['entrega', 'entrega do material', 'entrega material', 'data de entrega', 'data entrega', 'entrega prevista'],

const normTxt = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const CAB_MODELO = ['Código', 'Nome', 'Endereço', 'Bairro', 'CEP', 'Município', 'UF', 'Câmeras', 'Latitude', 'Longitude'];
function lerMatriz(cel) {
  cel = (cel || []).map((r) => r.map((c) => String(c ?? '').trim())).filter((r) => r.some((c) => c));
  if (!cel.length) return { itens: [], cab: null };
  const mapa = {};
  cel[0].forEach((h, i) => { const n = normTxt(h); for (const [k, nomes] of Object.entries(COLS_IMP)) if (!(k in mapa) && nomes.map(normTxt).includes(n)) mapa[k] = i; });
  let dados = cel;
  const eqCols = [];
  if (Object.keys(mapa).length >= 2) {
    dados = cel.slice(1);
    // demais colunas com título = equipamentos (quantidade por endereço)
    const ignorar = ['status', 'licenca', 'patrimonio', 'observacao', 'observacoes', 'situacao', 'atrasado', 'fim', 'fim previsto', 'dias', 'dias previstos'];
    const usados = new Set(Object.values(mapa));
    cel[0].forEach((h, i) => { if (!usados.has(i) && String(h).trim() && !ignorar.includes(normTxt(h))) eqCols.push([i, String(h).trim()]); });
  } else { mapa.nome = 0; mapa.municipio = 1; mapa.uf = 2; mapa.cameras = 3; } // sem cabeçalho: Nome, Município, UF, Câmeras
  const num = (v) => (v == null || v === '' ? null : String(v).replace(',', '.'));
  const camItem = itensCt.find((i) => ehCamera(i.nome));
  const itensDe = (c) => {
    const its = eqCols.filter(([i]) => String(c[i] ?? '').trim() !== '').map(([i, nome]) => ({ nome, quantidade: parseInt(c[i], 10) || 0 }));
    if (camItem && mapa.cameras !== undefined && !its.some((x) => ehCamera(x.nome)) && String(c[mapa.cameras] ?? '').trim() !== '') its.unshift({ nome: camItem.nome, quantidade: parseInt(c[mapa.cameras], 10) || 0 });
    return its;
  };
  const itens = dados.map((c) => ({
    codigo: c[mapa.codigo] || null, nome: c[mapa.nome] || '', logradouro: c[mapa.logradouro] || null,
    bairro: c[mapa.bairro] || null, cep: c[mapa.cep] || null, municipio: c[mapa.municipio] || '', uf: String(c[mapa.uf] || '').toUpperCase().slice(0, 2),
    cameras: parseInt(c[mapa.cameras], 10) || 0, lat: num(c[mapa.lat]), lon: num(c[mapa.lon]), itens: itensDe(c),
    ...(mapa.etapa !== undefined ? { etapa: c[mapa.etapa] || '', etapa_inicio: c[mapa.etapa_inicio] || '' } : {}),
    ...(mapa.ordem_etapa !== undefined ? { ordem_etapa: c[mapa.ordem_etapa] || '' } : {}),
    ...(mapa.equipe !== undefined ? { equipe: c[mapa.equipe] || '' } : {}),
    ...(mapa.inicio_previsto !== undefined ? { inicio_previsto: c[mapa.inicio_previsto] || '' } : {}),
    ...(mapa.concluido_em !== undefined ? { concluido_em: c[mapa.concluido_em] || '' } : {}),
    ...(mapa.entrega_material !== undefined ? { entrega_material: c[mapa.entrega_material] || '' } : {}),
    ...(mapa.na_rota !== undefined ? { na_rota: c[mapa.na_rota] || '' } : {}),
    ...(mapa.despacho_material !== undefined ? { despacho_material: c[mapa.despacho_material] || '' } : {}),
    ...(mapa.modo_logistico !== undefined ? { modo_logistico: c[mapa.modo_logistico] || '' } : {}),
  }));
  return { itens, cab: [...Object.keys(mapa), ...eqCols.map(([, n]) => n + ' (equip.)')] };
}
const lerLista = (txt) => lerMatriz(Planilha.lerCsv(txt));

    } catch (er) { RP.$('#e-geo-m', d.el).textContent = er.message; }
  }));
}

function etapasProjeto() {

    onSave: async (el) => {
      const etapas = RP.$$('.etrow', el).map((r) => ({ id: r.dataset.id ? +r.dataset.id : null, nome: r.querySelector('.et-n').value.trim(), data_inicio: r.querySelector('.et-d').value }))
        .filter((t) => t.nome || t.data_inicio);

      if (sem.length) { RP.$$('.etrow', el).forEach((r) => { if (!r.querySelector('.et-n').value.trim()) r.querySelector('.et-n').classList.add('invalid'); if (!r.querySelector('.et-d').value) r.querySelector('.et-d').classList.add('invalid'); }); throw new Error('Cada etapa precisa de nome e data de início (*)'); }
      await RP.api(`/clientes/${cli.id}/etapas`, { method: 'PUT', body: { etapas } });
      RP.toast('Etapas salvas'); abrir(cli.id);

  bind();
}
// Excluir endereços (admin e coordenador)
const podeExcluir = () => Shell.acao('excluir');
async function excluirEnderecos(lista, depois) {
  const n = lista.length;
  const nomes = lista.slice(0, 5).map((e) => '• ' + e.nome).join('\n') + (n > 5 ? `\n… e mais ${n - 5}` : '');
  if (!confirm(`Excluir ${n === 1 ? 'este endereço' : n + ' endereços'}?\n\n${nomes}\n\nApaga também as atividades, checklists e fotos. Não dá para desfazer.`)) return;
  try {
    const r = n === 1 ? await RP.api('/enderecos/' + lista[0].id, { method: 'DELETE' }).then(() => ({ excluidos: 1 }))
      : await RP.api('/enderecos/excluir', { method: 'POST', body: { endereco_ids: lista.map((e) => e.id) } });
    if (depois) depois();
    RP.toast(`${r.excluidos} endereço(s) excluído(s)`); abrir(cli.id);
  } catch (e) { RP.toast(e.message); }
}

      ${[...Array(nEq).keys()].map((i) => `<option value="${i + 1}">Equipe ${i + 1}</option>`).join('')}</select>${nEq ? '' : '<small>Defina a quantidade de equipes no topo da lista.</small>'}</div>
    <div class="field"><label for="mv-ini">Início previsto</label><select class="input" id="mv-inim"><option value="">Não alterar</option><option value="limpar">Apagar o início</option><option value="data">Mesma data para todos…</option></select>
      <input class="input" id="mv-ini" type="date" style="margin-top:6px" hidden></div>
    <div class="field"><label for="mv-rota">Painel de rotas</label><select class="input" id="mv-rota"><option value="">Não alterar</option><option value="sim">Incluir na rota</option><option value="nao">Tirar da rota</option></select></div>`, {
    saveLabel: 'Aplicar',
    onSave: async (el) => {
      const body = { endereco_ids: lista.map((e) => e.id) };
      const et = val(el, 'mv-et'), eq = val(el, 'mv-eq'), im = val(el, 'mv-inim');

// Quantidade de equipes do projeto
async function mudarEquipes(v2) {
  const n = v2 ? +v2 : null;
  const usados = Math.max(0, ...ends.map((e) => e.equipe || 0));
  if ((n || 0) < usados && !confirm(`Há endereços na Equipe ${usados}. Com ${n || 'nenhuma'} equipe(s), os endereços das equipes acima de ${n || 0} ficam sem equipe. Continuar?`)) { render(); return; }
  try {
    const r = await RP.api(`/clientes/${cli.id}/equipes`, { method: 'PUT', body: { equipes: n } });
    RP.toast(`${n ? n + ' equipe(s)' : 'Sem equipes'}${r.sem_equipe ? ` · ${r.sem_equipe} endereço(s) ficaram sem equipe` : ''}`);
    abrir(cli.id);
  } catch (e) { RP.toast(e.message); render(); }
}

// Resumo da regra de uma equipe para o chip: "8 Câmera/dia · seg–sáb"
function resumoRegra(t) {
  const r = (regrasInfo.regras || []).find((x) => x.equipe === t);
  if (!r) return '';
  const p = Object.entries(r.producao || {}).slice(0, 2).map(([n, q]) => `${fmtDias(q)} ${n}/dia`).join(', ');
  const ds = (r.dias_semana || []).slice().sort();
  const dsTxt = ds.join() === '1,2,3,4,5' ? '' : ds.map((d) => DIAS_NOME[d].slice(0, 3)).join(' ');
  return [p, dsTxt].filter(Boolean).join(' · ');
}

// Regras de cada equipe: dias de trabalho, início e quantidade de cada equipamento por dia
function regrasEquipes() {
  const n = cli.equipes || 1;
  const itens = regrasInfo.itens.length ? regrasInfo.itens : itensCt.map((i) => ({ nome: i.nome, total: i.total }));
  const regra = (t) => (regrasInfo.regras || []).find((x) => x.equipe === t) || { dias_semana: [1, 2, 3, 4, 5], producao: {}, min_dias: 0.5 };
  const bloco = (t) => { const r = regra(t); return `<div class="rgbox" data-t="${t}" style="--c:${corEq(t)}">
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><b><span class="eqdot"></span>Equipe ${t}</b>
        <label class="muted" style="font-size:.82rem">Começa em <input class="input rg-ini" type="date" style="width:auto;display:inline-block;padding:4px 8px" value="${r.inicio ? String(r.inicio).slice(0, 10) : ''}"></label></div>
      <div class="muted" style="font-size:.8rem;margin-bottom:4px">Dias de trabalho</div>
      <div class="chips" style="margin-bottom:10px">${DIAS_SEM.map((l, d) => `<label class="dchk" title="${DIAS_NOME[d]}"><input type="checkbox" class="rg-d" value="${d}" ${(r.dias_semana || []).includes(d) ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>

      <div class="rggrid">${itens.map((i) => `<label class="rgit"><span>${RP.esc(i.nome)}${i.total ? ` <small class="muted">(${RP.fmtN(i.total)} no projeto)</small>` : ''}</span><input class="input rg-q" data-n="${RP.esc(i.nome)}" type="number" min="0" step="0.5" placeholder="—" value="${r.producao && r.producao[i.nome] != null ? r.producao[i.nome] : ''}"><small>por dia</small></label>`).join('') || '<p class="muted">Cadastre os itens do projeto (Câmera, Servidor…) para informar a produção.</p>'}</div>
      <label class="rgit" style="margin-top:6px"><span>Mínimo em cada endereço</span><input class="input rg-min" type="number" min="0.5" step="0.5" value="${r.min_dias || 0.5}"><small>dia(s)</small></label>
    </div>`; };
  const d = RP.drawer('Regras das equipes', `
    <p class="muted" style="margin-top:0">Para cada equipe: em que dias trabalha e quanto instala por dia de cada equipamento. Os dias em cada endereço = soma de <b style="color:var(--ink)">quantidade ÷ produção por dia</b> de cada equipamento (arredonda para meio dia). Equipamento sem produção não conta; sem nenhuma produção, vale a faixa de câmeras (até 22 = 2 dias, até 32 = 3, acima = 4).</p>
    ${cli.equipes ? '' : '<div class="alert info" style="margin:0 0 10px">Defina a quantidade de equipes no topo da lista para ter mais equipes aqui.</div>'}
    <div class="rgall">${[...Array(n).keys()].map((i) => bloco(i + 1)).join('')}</div>
    ${n > 1 ? '<button class="btn sm" type="button" id="rg-cp">Copiar a Equipe 1 para todas</button>' : ''}
    <p class="muted" style="font-size:.85rem;margin-top:12px">Ao salvar, a duração e o fim previsto dos endereços em aberto são recalculados. Para refazer equipes e datas, use “Distribuir equipes e datas”.</p>`, {
    saveLabel: 'Salvar regras',
    onSave: async (el) => {
      const regras = RP.$$('.rgbox', el).map((b) => ({ equipe: +b.dataset.t, inicio: b.querySelector('.rg-ini').value,
        dias_semana: RP.$$('.rg-d', b).filter((x) => x.checked).map((x) => +x.value),
        producao: Object.fromEntries(RP.$$('.rg-q', b).filter((x) => x.value !== '').map((x) => [x.dataset.n, x.value])), min_dias: b.querySelector('.rg-min').value }));
      await RP.api(`/clientes/${cli.id}/equipe-regras`, { method: 'PUT', body: { regras } });
      RP.toast('Regras salvas · durações recalculadas'); abrir(cli.id);
    },
  });
  d.el.classList.add('wide');
  RP.$('#rg-cp', d.el)?.addEventListener('click', () => {

        <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><input class="input" id="ds-pd" type="number" min="1" max="200" value="${mt.por_dia}" style="width:90px" aria-label="Agências por dia"><span>agências por dia</span>
          <select class="input" id="ds-esc" style="width:auto"><option value="equipe" ${mt.escopo === 'equipe' ? 'selected' : ''}>por equipe</option><option value="total" ${mt.escopo === 'total' ? 'selected' : ''}>no total (dividido entre as equipes)</option></select></div>
        <div style="margin-top:8px"><label class="check"><input type="radio" name="ds-dias" value="uteis" ${mt.dias !== 'corridos' ? 'checked' : ''}> Só dias úteis (segunda a sexta, sem feriado)</label>
          <label class="check"><input type="radio" name="ds-dias" value="corridos" ${mt.dias === 'corridos' ? 'checked' : ''}> Dias corridos (todos os dias, inclusive fim de semana e feriado)</label></div>
        <p class="muted" id="ds-calc" style="font-size:.88rem;margin:6px 0 0"></p>
        <p class="muted" style="font-size:.8rem;margin:4px 0 0">Com a meta ligada, a produção por equipamento não é usada: cada agência ocupa uma vaga do dia da equipe, na ordem da rota.</p></div></div>
    <p class="muted" style="font-size:.85rem">Endereços com etapa começam na data da etapa. Nada é gravado agora: você vê a prévia, ajusta equipe e datas e depois grava.</p>`, {
    saveLabel: 'Ver prévia',
    onSave: async (el) => {
      const params = { equipes: +val(el, 'ds-n'), inicio: val(el, 'ds-ini'), todos: RP.$('input[name="ds-q"]:checked', el).value === 'todos' };
      const m2 = lerMeta(el);
      if (m2.ativo) { if (!(m2.por_dia >= 1)) throw new Error('Informe quantas agências por dia'); params.meta = m2; }
      try { localStorage.setItem('rp-meta-' + cli.id, JSON.stringify(m2)); } catch (_) { /* sem armazenamento */ }
      const r = await RP.api(`/clientes/${cli.id}/distribuir`, { method: 'POST', body: params });
      if (!r.itens.length) throw new Error('Nenhum endereço para distribuir com essas opções');
      setTimeout(() => previaDistribuicao(params, r), 50);
    },
  });
  RP.$('#ds-rg')?.addEventListener('click', (ev) => { ev.preventDefault(); regrasEquipes(); });
  const el = dd.el;
  const calc = () => {
    const m2 = lerMeta(el), k = +val(el, 'ds-n');
    RP.$('#ds-mbox', el).hidden = !m2.ativo;
    if (!m2.ativo) return;
    const todos = RP.$('input[name="ds-q"]:checked', el).value === 'todos';
    const n = ends.filter((e) => !concluido(e) && (todos ? PRE_EXEC.includes(e.status) : !e.equipe)).length;
    const porDia = m2.escopo === 'total' ? m2.por_dia : m2.por_dia * k;
    const dias = porDia ? Math.ceil(n / porDia) : 0;
    const divisao = m2.escopo === 'total' ? [...Array(k).keys()].map((t) => Math.floor(m2.por_dia / k) + (t < m2.por_dia % k ? 1 : 0)).join(' + ') : `${m2.por_dia} × ${k} equipe(s)`;
    RP.$('#ds-calc', el).innerHTML = m2.escopo === 'total' && m2.por_dia < k
      ? `<span class="tag-late">Meta total menor que o número de equipes: use no máximo ${m2.por_dia} equipe(s).</span>`
      : `<b style="color:var(--ink)">${n} endereço(s)</b> neste contrato · ${porDia} por dia (${divisao}) → cerca de <b style="color:var(--ink)">${dias} dia(s) ${m2.dias === 'corridos' ? 'corridos' : 'úteis'}</b>${dias ? ` · ~${Math.ceil(n / k)} por equipe` : ''}.`;
  };
  el.addEventListener('input', calc); el.addEventListener('change', calc); calc();
}
const lerMeta = (el) => ({ ativo: RP.$('#ds-meta', el).checked, por_dia: +RP.$('#ds-pd', el).value || 0, escopo: RP.$('#ds-esc', el).value, dias: (RP.$('input[name="ds-dias"]:checked', el) || {}).value || 'uteis' });

function previaDistribuicao(params, r) {
  let itens = r.itens.map((x) => ({ ...x })), resumo = r.resumo, sujo = false;
  const editIni = new Set();
  const d = RP.drawer('Prévia da distribuição', '<div id="pv"></div>', {
    saveLabel: 'Gravar nos endereços',
    onSave: async () => {
      if (sujo) await recalcular();
      const g = await RP.api(`/clientes/${cli.id}/distribuir/aplicar`, { method: 'POST', body: { equipes: params.equipes, itens: itens.map((x) => ({ id: x.id, equipe: x.equipe, inicio: x.inicio, fim: x.fim, dias: x.dias })) } });
      RP.toast(`${g.gravados} endereço(s) gravados com equipe, início e fim`); fEquipe = ''; abrir(cli.id);
    },
  });
  d.el.classList.add('wide');
  const box = RP.$('#pv', d.el);
  async function recalcular() {
    const fixos = itens.map((x) => ({ id: x.id, equipe: x.equipe, inicio: editIni.has(x.id) ? x.inicio : undefined }));
    const r2 = await RP.api(`/clientes/${cli.id}/distribuir`, { method: 'POST', body: { ...params, fixos } });
    itens = r2.itens.map((x) => ({ ...x })); resumo = r2.resumo; r = r2; sujo = false; draw();
  }
  function draw() {
    box.innerHTML = `<div class="pvres">${resumo.filter((x) => x.enderecos).map((x) => `<div class="pvcard" style="--c:${corEq(x.equipe)}"><b>Equipe ${x.equipe}</b><span>${x.enderecos} end. · ${fmtDias(x.dias)} dia(s)${r.meta ? ` · ${r.meta.por_equipe[x.equipe - 1]} por dia` : ' de trabalho'}</span><span>${dBr(x.inicio)} → ${dBr(x.fim)}</span>${r.meta ? `<small>meta: ${r.meta.dias === 'corridos' ? 'dias corridos' : 'só dias úteis'}</small>` : resumoRegra(x.equipe) ? `<small>${RP.esc(resumoRegra(x.equipe))}</small>` : '<small>sem regra: faixa de câmeras, seg–sex</small>'}</div>`).join('')}</div>
      ${r.sem_localizacao ? `<div class="alert info" style="margin:8px 0">${r.sem_localizacao} endereço(s) sem município reconhecido ficaram de fora.</div>` : ''}
      <div class="row" style="margin:10px 0;gap:8px"><span class="muted" style="font-size:.85rem;flex:1">Mude a <b style="color:var(--ink)">equipe</b> ou o <b style="color:var(--ink)">início</b> de qualquer linha. “Recalcular datas” refaz a sequência das equipes mantendo o que você mudou.</span>
        <button class="btn sm" type="button" id="pv-rc" ${sujo ? '' : 'disabled'}>Recalcular datas</button></div>
      <div class="scroll" style="max-height:calc(100vh - 330px)"><table class="tbl"><thead><tr><th>Equipe</th><th>Início</th><th>Fim</th><th>Dias</th><th>Endereço</th><th>Município</th><th>Equipamentos</th></tr></thead><tbody>
      ${itens.map((x, i) => `<tr${editIni.has(x.id) ? ' class="pvfix"' : ''}><td><select class="input pv-eq" data-i="${i}" style="padding:4px 6px;width:auto;border-left:4px solid ${corEq(x.equipe)}">${[...Array(params.equipes).keys()].map((t) => `<option value="${t + 1}" ${t + 1 === x.equipe ? 'selected' : ''}>Equipe ${t + 1}</option>`).join('')}</select></td>
        <td><input class="input pv-ini" data-i="${i}" type="date" value="${x.inicio}" style="padding:4px 6px;width:auto"></td><td style="white-space:nowrap">${dBr(x.fim)}</td>
        <td>${x.fonte === 'meta' ? '<small class="muted">meta</small>' : fmtDias(x.dias)}${x.fonte === 'faixa' ? ' <small class="muted" title="Sem produção cadastrada: faixa de câmeras">faixa</small>' : ''}</td>
        <td><b>${RP.esc(x.nome)}</b>${x.etapa ? `<div class="muted" style="font-size:.78rem">${RP.esc(x.etapa)}</div>` : ''}</td><td>${RP.esc(x.municipio)}/${x.uf}</td>
        <td class="muted" style="font-size:.82rem">${resumoItens(x.itens) || x.cameras + ' câmeras'}</td></tr>`).join('')}</tbody></table></div>`;
    RP.$$('.pv-eq', box).forEach((s2) => (s2.onchange = () => { itens[+s2.dataset.i].equipe = +s2.value; sujo = true; RP.$('#pv-rc', box).disabled = false; s2.style.borderLeftColor = corEq(+s2.value); }));
    RP.$$('.pv-ini', box).forEach((s2) => (s2.onchange = () => { const x = itens[+s2.dataset.i]; if (!s2.value) return; x.inicio = s2.value; editIni.add(x.id); sujo = true; RP.$('#pv-rc', box).disabled = false; s2.closest('tr').classList.add('pvfix'); }));
    RP.$('#pv-rc', box).onclick = () => RP.busy(RP.$('#pv-rc', box), async () => { try { await recalcular(); } catch (e) { RP.toast(e.message); } });
  }
  draw();
}

async function enviarPdf(id, file) {
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { RP.toast('O PDF precisa ter até 10 MB'); return; }
  const base64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
  try { await RP.api(`/contratos/${id}/arquivos`, { method: 'POST', body: { nome: file.name, base64 } }); RP.toast('PDF anexado'); abrir(cli.id); }
  catch (e) { RP.toast(e.message); }
}
