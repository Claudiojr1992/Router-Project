<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projetos · RoutProject</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/planilha.js"></script>
</head>
<body>
<script>
const ST = { a_fazer: 'A fazer', em_andamento: 'Em andamento', aguardando: 'Aguardando', concluida: 'Concluída' };
const ICO_REL = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
const TIPO = { tecnico: ['Técnico', 'tec'], coordenacao: ['Coordenação', 'coo'], administrativo: ['Administrativo', 'adm'] };
let mon = new Map();
let S, user, pessoas = [], proj = null, filtro = { q: '', uf: '', resp: '', et: '' };

// Situação do card: concluído quando atinge a meta; atenção quando há endereço atrasado; senão em execução
const metaDe = (p) => p.meta_instalacoes || p.enderecos;
const situacao = (p) => (!p.enderecos_total ? 'preparo' : p.enderecos && p.concluidos >= metaDe(p) ? 'concluido' : p.atencao ? 'atencao' : 'execucao');
const SIT = { preparo: ['Em preparação', 'var(--muted)'], atencao: ['Requer atenção', 'var(--err)'], execucao: ['Em execução', 'var(--info)'], concluido: ['Concluído', 'var(--ok)'] };
const pctP = (p) => { const m = metaDe(p); return m ? Math.min(100, Math.round((p.concluidos / m) * 100)) : 0; };
const ICO = {
  un: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
  at: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  ed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>',
};
let carteira = [], filtroL = 'todos', busca = '';
const lembrarCt = (cli, ct) => { try { localStorage.setItem('rp-ct-' + cli, String(ct)); } catch (_) { /* sem armazenamento */ } };
const ultimoCt = (cli) => { try { return +localStorage.getItem('rp-ct-' + cli) || null; } catch (_) { return null; } };

(async () => {
  S = await Shell.init({ key: 'projetos', title: 'Projetos', sub: 'Todos os projetos: avanço, atenção e o que falta preparar', perfis: Shell.ESC });
  user = S.user;
  const qs = new URLSearchParams(location.search);
  const id = +qs.get('id'), cli = +qs.get('cliente');
  if (cli && !id) { await abrirCliente(cli); return; }
  if (id) { await abrir(id); if (qs.get('acao') === 'distribuir' && Shell.acao('distribuir')) distribuir(); } else lista();
})();

// ---------- Lista única de projetos (um card por cliente) ----------
async function lista() {
  history.replaceState(null, '', '/app/projetos.html');
  RP.$('#pjabas')?.remove();
  RP.$('.top h1').textContent = 'Projetos'; document.title = 'Projetos · RoutProject';
  S.sub.textContent = 'Todos os projetos: avanço, atenção e o que falta preparar';
  const novo = Shell.pode('clientes', 'editar');
  S.actions.innerHTML = novo ? '<a class="btn sm primary" href="/app/clientes.html?novo=1">+ Novo projeto</a>' : '';
  carteira = await RP.api('/carteira');
  const T = carteira.reduce((a, p) => ({ u: a.u + p.enderecos, c: a.c + p.concluidos, m: a.m + metaDe(p), at: a.at + p.atencao, ex: a.ex + p.em_execucao }), { u: 0, c: 0, m: 0, at: 0, ex: 0 });
  const g = T.m ? Math.min(100, Math.round((T.c / T.m) * 100)) : 0;
  const n = { todos: carteira.length, atencao: 0, execucao: 0, concluido: 0, preparo: 0 };
  carteira.forEach((p) => n[situacao(p)]++);
  S.content.innerHTML = `
    ${carteira.length ? `<section class="pjhero card">
      <div class="pjring" style="--p:${g}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50"/><circle cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="${g} 100"/></svg><div><b>${g}%</b><span>instalado</span></div></div>
      <div class="pjhero-t"><h2>Avanço geral das instalações</h2><p class="muted">${RP.fmtN(T.c)} de ${RP.fmtN(T.m)} endereços da meta concluídos em ${carteira.length} projeto(s)</p>
        <div class="pjbar lg"><i style="width:${g}%"></i></div></div>
      <div class="pjhero-k">
        <div><span>Unidades na rota</span><b>${RP.fmtN(T.u)}</b></div>
        <div><span>Concluídas</span><b style="color:var(--ok)">${RP.fmtN(T.c)}</b></div>
        <div><span>Em execução</span><b style="color:var(--info)">${RP.fmtN(T.ex)}</b></div>
        <div><span>Atenção</span><b style="color:${T.at ? 'var(--err)' : 'inherit'}">${RP.fmtN(T.at)}</b></div>
      </div>
    </section>
    <div class="pjtools">
      <input class="input" id="pj-q" type="search" placeholder="Buscar projeto" value="${RP.esc(busca)}" aria-label="Buscar projeto">
      <div class="vtabs" role="tablist" aria-label="Filtrar projetos" style="margin:0">${[['todos', 'Todos'], ['atencao', 'Com atenção'], ['execucao', 'Em execução'], ['preparo', 'Em preparação'], ['concluido', 'Concluídos']]
        .filter(([k]) => k === 'todos' || n[k]).map(([k, t]) => `<button type="button" role="tab" class="eqc" data-f="${k}" aria-pressed="${filtroL === k}">${t} <small>${n[k]}</small></button>`).join('')}</div>
    </div>` : ''}
    <div class="pjgrid" id="pj-grid"></div>`;
  const q$ = RP.$('#pj-q');
  if (q$) q$.oninput = () => { busca = q$.value; cards(); };
  RP.$$('[data-f]').forEach((b) => (b.onclick = () => { filtroL = b.dataset.f; RP.$$('[data-f]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); cards(); }));
  cards();
}

// Para onde o card leva: projeto sem endereço vai para o cadastro (guia de preparação); senão para o painel
function destino(p) {
  if ((!p.enderecos_total || !Shell.pode('rota')) && Shell.pode('clientes')) return `/app/clientes.html?id=${p.id}`;
  if (Shell.pode('rota')) return `/app/rota.html?c=${p.id}`;
  return `/app/projetos.html?cliente=${p.id}`;
}

function cards() {
  const lq = busca.trim().toLowerCase();
  const l = carteira.filter((p) => (filtroL === 'todos' || situacao(p) === filtroL) && (!lq || p.nome.toLowerCase().includes(lq)));
  const el = RP.$('#pj-grid');
  const editaMeta = Shell.pode('rota', 'editar');
  const novo = Shell.pode('clientes', 'editar') && filtroL === 'todos' && !lq ? '<a class="pjnovo" href="/app/clientes.html?novo=1"><b>+</b>Novo projeto<small class="muted" style="font-weight:400">Cliente, contrato e itens num formulário só</small></a>' : '';
  if (!l.length) { el.innerHTML = novo || '<div class="card empty" style="grid-column:1/-1">Nenhum projeto neste filtro.</div>'; return; }
  el.innerHTML = l.map((p) => {
    const st = situacao(p), m = metaDe(p), falta = Math.max(0, m - p.concluidos), pc = pctP(p);
    const extra = [p.contratos.length > 1 ? `<span>${p.contratos.length} contratos</span>` : '', p.sem_responsavel ? `<span class="warn">${RP.fmtN(p.sem_responsavel)} sem responsável</span>` : '', p.fora_rota ? `<span>${p.fora_rota} fora da rota</span>` : ''].join('');
    return `<article class="pjcard" data-href="${destino(p)}" tabindex="0" role="link" aria-label="Abrir projeto ${RP.esc(p.nome)}">
      <div class="pjtop"><span class="pjbadge" style="--c:${SIT[st][1]}"><i></i>${SIT[st][0]}</span></div>
      <h3>${RP.esc(p.nome)}</h3>
      <p class="pjdate">Criado em ${RP.fmtData(p.criado_em)}${p.fim_previsto ? ` · término previsto ${RP.fmtData(p.fim_previsto)}` : ''}</p>
      ${extra ? `<div class="pjextra">${extra}</div>` : ''}
      ${p.enderecos_total ? `<div class="pjmeta">
        <div><span>Meta de instalações</span><b>${RP.fmtN(p.concluidos)} <small>/ ${RP.fmtN(m)}</small></b><small class="${falta ? '' : 'ok'}">${falta ? `${RP.fmtN(falta)} para concluir` : 'Meta atingida'}</small></div>
        ${editaMeta ? `<button type="button" class="pjedit" data-meta="${p.id}" title="Editar a meta de instalações" aria-label="Editar a meta de ${RP.esc(p.nome)}">${ICO.ed}</button>` : ''}
      </div>
      <div class="pjprog"><div class="pjprog-h"><span>Avanço da meta</span><b>${pc}%</b></div><div class="pjbar" style="--c:${SIT[st][1]}"><i style="width:${pc}%"></i></div></div>
      <div class="pjtiles">
        <div><span class="ic">${ICO.un}</span><b>${RP.fmtN(p.enderecos)}</b><small>Unidades</small></div>
        <div><span class="ic ok">${ICO.ok}</span><b>${RP.fmtN(p.concluidos)}</b><small>Concluídas</small></div>
        <div class="${p.atencao ? 'hot' : ''}"><span class="ic at">${ICO.at}</span><b>${RP.fmtN(p.atencao)}</b><small>Atenção</small></div>
      </div>` : '<p class="muted" style="margin:0">Ainda sem endereços. Abra para seguir a preparação do projeto.</p>'}
      <p class="pjopen">Abrir projeto →</p>
    </article>`;
  }).join('') + novo;
  RP.$$('.pjcard', el).forEach((c) => {
    c.onclick = () => { location.href = c.dataset.href; };
    c.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.href = c.dataset.href; } };
  });
  RP.$$('[data-meta]', el).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); editarMeta(carteira.find((p) => p.id === +b.dataset.meta)); }));
}

function editarMeta(p) {
  RP.drawer(`Meta de instalações · ${p.nome}`, `
    <p class="muted" style="margin-top:0">Quantos endereços este projeto precisa instalar. Deixe em branco para usar todos os endereços na rota (${RP.fmtN(p.enderecos)}).</p>
    <div class="field"><label for="mt-v">Meta (endereços)</label><input class="input" id="mt-v" type="number" min="1" inputmode="numeric" value="${p.meta_instalacoes || ''}" placeholder="${p.enderecos}"></div>
    <p class="muted" style="font-size:.88rem">Concluídos hoje: <b style="color:var(--ink)">${RP.fmtN(p.concluidos)}</b>. Endereços fora da rota não contam (marque em Cadastro e endereços).</p>`, {
    onSave: async (el) => {
      await RP.api(`/rota/${p.id}/meta`, { method: 'PUT', body: { meta: RP.$('#mt-v', el).value } });
      RP.toast('Meta atualizada'); lista();
    },
  });
}

// ---------- Execução de um projeto (um contrato; troca de contrato pelas abas do projeto) ----------
async function abrirCliente(cli) {
  const cts = (await RP.api('/projetos')).filter((p) => p.cliente_id === cli);
  if (!cts.length) {
    Shell.projeto({ id: cli, nome: 'Projeto', ativo: 'projetos' });
    S.sub.textContent = 'Execução';
    S.content.innerHTML = `<div class="card empty"><p style="margin:0 0 12px">Este projeto ainda não tem contrato.</p>${Shell.pode('clientes') ? `<a class="btn primary" href="/app/clientes.html?id=${cli}">Ir para Cadastro e endereços</a>` : ''}</div>`;
    return;
  }
  const lem = ultimoCt(cli);
  await abrir((cts.find((c) => c.id === lem) || cts[0]).id);
}

async function abrir(id) {
  if (!pessoas.length) pessoas = await RP.api('/pessoas').catch(() => []);
  [proj] = await Promise.all([RP.api('/projetos/' + id), carregarMon(id)]);
  const cliId = proj.contrato.cliente_id;
  lembrarCt(cliId, id);
  history.replaceState(null, '', '/app/projetos.html?id=' + id);
  const irmaos = (await RP.api('/projetos').catch(() => [])).filter((p) => p.cliente_id === cliId);
  const sel = irmaos.length > 1 ? `<select class="input" id="pj-ct" style="width:auto" aria-label="Contrato">${irmaos.map((c) => `<option value="${c.id}" ${c.id === id ? 'selected' : ''}>${RP.esc(c.numero)}${c.tipo === 'aditivo' ? ' (aditivo)' : ''}</option>`).join('')}</select>` : '';
  Shell.projeto({ id: cliId, nome: proj.contrato.cliente, ativo: 'projetos', extra: sel });
  RP.$('#pj-ct')?.addEventListener('change', (e) => abrir(+e.target.value));
  S.sub.textContent = `Execução · ${proj.contrato.numero}: atividades de cada endereço e responsáveis`;
  const gestor = Shell.acao('distribuir');
  S.actions.innerHTML = `<button class="btn sm" id="monl" title="Planilha de ativos, importação e envio ao Zabbix">Monitoramento</button>${gestor ? '<button class="btn sm primary" id="dist">Distribuir atividades</button>' : ''}`;
  RP.$('#monl').onclick = monLote;
  if (gestor) RP.$('#dist').onclick = distribuir;
  render();
}

function render() {
  const all = proj.enderecos.flatMap((e) => e.tarefas);
  const conc = all.filter((t) => t.status === 'concluida').length;
  const sem = all.filter((t) => !t.responsavel_id).length;
  const deleg = all.filter((t) => t.responsavel_tipo && t.responsavel_tipo !== 'tecnico').length;
  const ufs = [...new Set(proj.enderecos.map((e) => e.uf))].sort();
  const q = filtro.q.toLowerCase();
  const etps = [...new Map(proj.enderecos.filter((e) => e.etapa_id).map((e) => [e.etapa_id, e])).values()];
  const ends = proj.enderecos.filter((e) => (!filtro.uf || e.uf === filtro.uf) && (!filtro.et || (filtro.et === 'sem' ? !e.etapa_id : String(e.etapa_id) === filtro.et)) &&
    (!q || (e.nome + ' ' + e.municipio + ' ' + (e.codigo || '')).toLowerCase().includes(q)) &&
    (!filtro.resp || e.tarefas.some((t) => (filtro.resp === 'none' ? !t.responsavel_id : String(t.responsavel_id) === filtro.resp))));
  const itensCt = proj.itens || [];
  const cols = `minmax(210px,1.3fr) minmax(170px,230px) 150px repeat(${proj.atividades.length}, minmax(150px,1fr))`;
  S.content.innerHTML = `
    <div class="kpis">
      <div class="kpi"><span>Endereços</span><b>${RP.fmtN(proj.enderecos.length)}</b></div>
      <div class="kpi"><span>Atividades concluídas</span><b>${RP.fmtN(conc)} <small class="muted" style="font-size:1rem">de ${RP.fmtN(all.length)}</small></b></div>
      <div class="kpi"><span>Sem responsável</span><b style="color:${sem ? 'var(--warn)' : 'inherit'}">${RP.fmtN(sem)}</b></div>
      <div class="kpi"><span>Delegadas (fora do campo)</span><b>${RP.fmtN(deleg)}</b></div>
    </div>
    <div class="card">
      <header class="toolbar">
        <input class="input" id="q" placeholder="Buscar endereço ou município" value="${RP.esc(filtro.q)}" aria-label="Buscar">
        <select class="input" id="uf" style="max-width:160px" aria-label="UF"><option value="">Todas as UFs</option>${ufs.map((u) => `<option ${u === filtro.uf ? 'selected' : ''}>${u}</option>`).join('')}</select>
        ${etps.length ? `<select class="input" id="fet" style="max-width:200px" aria-label="Etapa"><option value="">Todas as etapas</option><option value="sem" ${filtro.et === 'sem' ? 'selected' : ''}>Sem etapa</option>${etps.map((e) => `<option value="${e.etapa_id}" ${String(e.etapa_id) === filtro.et ? 'selected' : ''}>${RP.esc(e.etapa)} · ${RP.fmtData(e.etapa_inicio)}</option>`).join('')}</select>` : ''}
        <select class="input" id="resp" style="max-width:220px" aria-label="Responsável"><option value="">Qualquer responsável</option><option value="none" ${filtro.resp === 'none' ? 'selected' : ''}>Sem responsável</option>
          ${pessoas.filter((p) => p.ativo).map((p) => `<option value="${p.id}" ${String(p.id) === filtro.resp ? 'selected' : ''}>${RP.esc(p.nome)}</option>`).join('')}</select>
        <span class="spacer"></span><span class="muted">${ends.length} endereço(s)</span>
      </header>
      <div class="scroll" style="max-height:calc(100vh - 330px)">
        <div class="matrix" style="grid-template-columns:${cols};min-width:${590 + proj.atividades.length * 150}px">
          <div class="mh">Endereço</div><div class="mh" title="Quantidade de cada item do contrato neste endereço · role para o lado">Itens do contrato</div><div class="mh" title="Subir os ativos para o Zabbix depois que todas as atividades forem concluídas">Monitoramento</div>${proj.atividades.map((a) => `<div class="mh" title="${RP.esc(a.nome)}">${RP.esc(a.curto || a.nome)}</div>`).join('')}
          ${ends.map((e) => `<div class="mc"><b>${RP.esc(e.nome)}</b><div class="muted" style="font-size:.8rem">${RP.esc(e.municipio)}/${e.uf} · ${RP.esc(e.status)}${e.tarefas.some((t) => t.fotos) ? ` · <a href="/api/enderecos/${e.id}/evidencias.zip" title="Baixar fotos e relatórios deste endereço">evidências</a>` : ''}</div>${e.etapa ? `<div style="font-size:.78rem;color:var(--accent)">${RP.esc(e.etapa)}${e.ordem_etapa ? ' · ' + e.ordem_etapa + 'º' : ''} · início ${RP.fmtData(e.etapa_inicio)}</div>` : ''}</div>
            <div class="mc"><div class="itroll" tabindex="0" aria-label="Itens do contrato em ${RP.esc(e.nome)}">${itensCt.length ? itensCt.map((i) => { const n = (e.itens || {})[i.id] || 0; return `<span class="itq${n ? '' : ' z'}" title="${RP.esc(i.nome)}: ${n}"><b>${RP.fmtN(n)}</b>${RP.esc(i.nome)}</span>`; }).join('') : `<span class="itq"><b>${RP.fmtN(e.cameras)}</b>Câmeras</span>`}</div></div>
            <div class="mc">${monChip(e)}</div>
            ${proj.atividades.map((a) => { const t = e.tarefas.find((x) => x.atividade_id === a.id); if (!t) return '<div class="mc"></div>';
              const pre = a.predecessora_id && t.status !== 'concluida' ? e.tarefas.find((x) => x.atividade_id === a.predecessora_id) : null;
              const bloq = pre && pre.status !== 'concluida' ? proj.atividades.find((x) => x.id === a.predecessora_id) : null;
              const rel = t.status === 'concluida' ? 'final' : (t.ck_feitos || t.fotos || t.status !== 'a_fazer' ? 'parcial' : '');
              return `<div class="mc"><div class="cellw"><button class="cell ${t.responsavel_id ? '' : 'none'}" data-t="${t.id}"><span class="pill ${t.status}"><i></i>${ST[t.status]}</span>
                <small>${t.responsavel ? RP.esc(t.responsavel) + (t.responsavel_tipo !== 'tecnico' ? ' · ' + TIPO[t.responsavel_tipo][0] : '') : 'Sem responsável'}</small>
                ${bloq ? `<small class="lock" title="Só pode ser concluída depois de: ${RP.esc(bloq.nome)}">🔒 aguarda ${RP.esc(bloq.curto || bloq.nome)}</small>` : ''}
                ${t.ck_total || t.fotos ? `<small class="ckp">${t.ck_total ? `Checklist ${t.ck_feitos}/${t.ck_total}` : ''}${t.ck_total && t.fotos ? ' · ' : ''}${t.fotos ? `${t.fotos} foto(s)` : ''}</small>` : ''}</button>
                ${rel ? `<a class="relico ${rel}" href="/api/tarefas/${t.id}/relatorio.pdf" target="_blank" rel="noopener" title="${rel === 'final' ? 'Relatório final (PDF)' : 'Relatório parcial (PDF)'}" aria-label="${rel === 'final' ? 'Relatório final' : 'Relatório parcial'}">${ICO_REL}</a>` : ''}</div></div>`; }).join('')}`).join('')}
        </div>
        ${ends.length ? '' : '<div class="empty">Nenhum endereço com esses filtros.</div>'}
      </div>
    </div>`;
  const q$ = RP.$('#q'); q$.oninput = () => { filtro.q = q$.value; clearTimeout(q$._t); q$._t = setTimeout(() => { render(); RP.$('#q').focus(); RP.$('#q').setSelectionRange(99, 99); }, 250); };
  RP.$('#uf').onchange = (e) => { filtro.uf = e.target.value; render(); };
  RP.$('#resp').onchange = (e) => { filtro.resp = e.target.value; render(); };
  RP.$('#fet')?.addEventListener('change', (e) => { filtro.et = e.target.value; render(); });
  RP.$$('.cell', S.content).forEach((b) => (b.onclick = () => editar(+b.dataset.t)));
  RP.$$('[data-mon]', S.content).forEach((b) => (b.onclick = () => monitorar(+b.dataset.mon)));
}

// ---------- Monitoramento (Zabbix) ----------
async function carregarMon(id) { mon = new Map((await RP.api(`/contratos/${id}/monitoramento`).catch(() => [])).map((m) => [m.endereco_id, m])); }
function monEstado(e) {
  const m = mon.get(e.id) || { ativos: 0, enviados: 0, erros: 0 };
  const tot = e.tarefas.length, con = e.tarefas.filter((t) => t.status === 'concluida').length;
  if (m.ativos && m.enviados === m.ativos) return ['No Zabbix ✓', 'var(--ok)', `${m.enviados} host(s) monitorados`];
  if (m.erros) return ['Erro no envio', 'var(--err)', `${m.erros} ativo(s) com erro`];
  if (tot && con < tot) return [`Atividades ${con}/${tot}`, 'var(--muted)', 'Sobe para o monitoramento quando todas as atividades forem concluídas'];
  if (!m.ativos) return ['Cadastrar ativos', 'var(--warn)', 'Atividades concluídas: informe hostname e IP dos ativos'];
  return ['Pronto para subir', 'var(--info)', `${m.ativos} ativo(s) prontos para o Zabbix`];
}

const CAB_MON = ['Código do endereço', 'Endereço', 'Hostname', 'IP', 'Tipo', 'Interface', 'Porta', 'Grupo', 'Template', 'Comunidade SNMP'];
function monLote() {
  const ends = proj.enderecos;

    <p id="ml-p" class="muted" style="font-size:.85rem"></p>
    <button type="button" class="btn sm" id="ml-imp" disabled>Importar ativos</button>

    <button type="button" class="btn primary" id="ml-env">Subir os prontos para o Zabbix</button>
    <div id="ml-r" style="margin-top:10px"></div>`, { saveLabel: 'Fechar', onSave: async () => {} });
  const el = dr.el; let linhas = null;
  RP.$('#ml-mod', el).onclick = async () => {
    const atv = await RP.api(`/contratos/${proj.contrato.id}/monitoramento`);

      if (m && m.ativos) { const d = await RP.api(`/enderecos/${e.id}/monitoramento`); d.ativos.forEach((a) => rows.push([e.codigo || '', e.nome, a.hostname, a.ip, a.tipo, a.interface, a.porta || '', a.grupo || '', a.template || '', a.comunidade || ''])); }
      else rows.push([e.codigo || '', e.nome, '', '', 'camera', 'snmp', '', '', '', '']);
    }
    const instr = [['Como preencher'], ['Código do endereço: o mesmo código cadastrado em Clientes → Endereços (obrigatório para ligar o ativo).'], ['Hostname: nome único do host no Zabbix (letras, números, ponto, hífen, sublinhado).'], ['IP: endereço IP do ativo.'],

      const cab = (m[0] || []).map(norm);
      const col = (...ns) => cab.findIndex((c) => ns.some((n) => c === n || c.startsWith(n)));
      const ix = { codigo: col('codigo do endereco', 'codigo', 'cod'), endereco: col('endereco', 'agencia', 'nome'), hostname: col('hostname', 'host'), ip: col('ip'), tipo: col('tipo'), interface: col('interface'), porta: col('porta'), grupo: col('grupo'), template: col('template'), comunidade: col('comunidade') };
      if (ix.hostname < 0 || ix.ip < 0) throw new Error('A planilha precisa das colunas Hostname e IP (use o modelo)');
      linhas = m.slice(1).filter((r) => r.some((c) => String(c).trim())).filter((r) => String(r[ix.hostname] || '').trim() || String(r[ix.ip] || '').trim())

      RP.$('#ml-p', el).textContent = `${linhas.length} ativo(s) em ${new Set(linhas.map((l) => l.codigo || l.endereco)).size} endereço(s). Linhas sem hostname e IP são ignoradas.`;

  };
  RP.$('#ml-imp', el).onclick = (ev) => RP.busy(ev.currentTarget, async () => {
    try {
      const r = await RP.api(`/contratos/${proj.contrato.id}/monitoramento/importar`, { method: 'POST', body: { linhas: linhas.map((l) => ({ ...l, porta: l.porta || null })), substituir: RP.$('#ml-sub', el).checked } });
      RP.toast(`${r.criados} ativo(s) novos e ${r.atualizados} atualizados em ${r.enderecos} endereço(s)`);
      await carregarMon(proj.contrato.id); render();
    } catch (e2) { RP.$('#ml-p', el).textContent = e2.message; RP.toast('A planilha tem erros'); }
  });
  RP.$('#ml-env', el).onclick = (ev) => RP.busy(ev.currentTarget, async () => {
    try {
      const r = await RP.api(`/contratos/${proj.contrato.id}/monitoramento/enviar`, { method: 'POST', body: {} });
      RP.$('#ml-r', el).innerHTML = `<p><b>${r.enderecos}</b> endereço(s) processados · <b style="color:var(--ok)">${r.enviados}</b> host(s) no Zabbix.</p>${r.com_erro.length ? `<ul class="mnlog">${r.com_erro.map((x) => `<li><b>${RP.esc(x.nome || '')}</b>: ${RP.esc(x.erros.join('; '))}</li>`).join('')}</ul>` : ''}`;
      await carregarMon(proj.contrato.id); render();
    } catch (e2) { RP.toast(e2.message); }
  });
}

function opcoesPessoas(sel) {
  const g = (tipo) => pessoas.filter((p) => p.ativo && p.tipo === tipo);

}

function duracao(a, b) {
  if (!a || !b) return '—';
  const min = Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000)), d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60);
  return [d ? d + ' d' : '', h ? h + ' h' : '', (min % 60) + ' min'].filter(Boolean).join(' ');
}

  const ev = await RP.api(`/tarefas/${tid}/eventos`);
  RP.api(`/tarefas/${tid}/fotos`).then((fs) => {
    RP.$('#d-fotos', d.el).innerHTML = fs.length ? `<div class="row" style="gap:8px">${fs.map((f) => `<a href="/api/fotos/${f.id}" target="_blank" rel="noopener" title="${RP.esc((f.item || f.legenda || 'Foto') + ' · ' + RP.fmtDataHora(f.tirada_em || f.criado_em))}"><img src="/api/fotos/${f.id}" alt="${RP.esc(f.item || f.legenda || 'Foto')}" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)" loading="lazy"></a>`).join('')}</div>` : 'Nenhuma foto enviada pelo app ainda.';
  }).catch(() => { RP.$('#d-fotos', d.el).textContent = ''; });
  RP.$('#d-h', d.el).innerHTML = ev.length ? ev.map((x) => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b style="color:var(--ink)">${RP.esc(x.usuario || 'Sistema')}</b> · ${RP.fmtDataHora(x.criado_em)}<br>${x.tipo === 'comentario' ? '💬 ' : ''}${RP.esc(x.detalhe)}</div>`).join('') : 'Sem movimentações.';
}

// Assinatura do relatório pelo cliente: gera um link para enviar por WhatsApp ou e-mail
async function assinaturaBox(tid, box) {
  try {
    const st = await RP.api(`/tarefas/${tid}/assinatura`);
    box.innerHTML = st.assinado
      ? `<b class="ok">✓ Assinado pelo cliente</b><span class="muted">${RP.esc(st.assinado.nome)}${st.assinado.cargo ? ' · ' + RP.esc(st.assinado.cargo) : ''} · ${RP.fmtDataHora(st.assinado.assinado_em)}. O relatório em PDF já sai com a assinatura.</span>`
      : `<b>Assinatura do cliente</b><span class="muted">${st.pendente ? `Link enviado em ${RP.fmtDataHora(st.pendente.criado_em)}, válido até ${RP.fmtData(st.pendente.expira_em)}. Gere outro se precisar reenviar.` : 'O cliente abre o link, confere o relatório e assina com o dedo ou o mouse.'}</span>
         <button class="btn sm primary" type="button" id="ass-go">${st.pendente ? 'Gerar novo link' : 'Gerar link para assinar'}</button><div id="ass-link"></div>`;
    RP.$('#ass-go', box)?.addEventListener('click', (ev) => RP.busy(ev.currentTarget, async () => {
      try {
        const r = await RP.api(`/tarefas/${tid}/assinatura`, { method: 'POST' });
        const txt = encodeURIComponent(`Olá! Segue o relatório para conferência e assinatura: ${r.link}`);
        RP.$('#ass-link', box).innerHTML = `<div class="row" style="gap:6px;margin-top:8px"><input class="input" readonly value="${RP.esc(r.link)}" style="flex:1;min-width:200px" aria-label="Link de assinatura">
          <button class="btn sm" type="button" id="ass-cp">Copiar</button><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/?text=${txt}">WhatsApp</a>
          <a class="btn sm" href="mailto:?subject=${encodeURIComponent('Relatório para assinatura')}&body=${txt}">E-mail</a></div><small class="muted">Válido até ${RP.fmtData(r.expira_em)}.</small>`;
        RP.$('#ass-cp', box).onclick = async () => { try { await navigator.clipboard.writeText(r.link); RP.toast('Link copiado'); } catch (_) { RP.$('#ass-link input', box).select(); } };
      } catch (e) { RP.toast(e.message); }
    }));
  } catch (_) { box.textContent = ''; }
}

function distribuir() {
  RP.drawer('Distribuir atividades', `
    <p class="muted" style="margin-top:0">Envia uma atividade de todos os endereços deste projeto para uma pessoa de uma vez. Atividades concluídas não mudam.</p>
    <div class="field"><label for="x-a">Atividade</label><select class="input" id="x-a">${proj.atividades.map((a) => `<option value="${a.id}">${RP.esc(a.nome)}</option>`).join('')}</select></div>
    <div class="field"><label for="x-p">Enviar para</label><select class="input" id="x-p">${opcoesPessoas(null).replace('<option value="">Sem responsável</option>', '<option value="">Escolha…</option>')}</select></div>
    <label class="check"><input type="checkbox" id="x-v" checked> Só onde ainda não há responsável</label>
    <label class="check"><input type="checkbox" id="x-r" checked> Guardar como regra do projeto (vale para endereços novos)</label>
    ${proj.regras.length ? `<h3 style="font-size:1.05rem;margin:18px 0 8px">Regras atuais</h3>${proj.regras.map((r) => `<div class="muted">${RP.esc(proj.atividades.find((a) => a.id === r.atividade_id)?.nome || '')} → <b style="color:var(--ink)">${RP.esc(r.pessoa || '—')}</b></div>`).join('')}` : ''}`, {
    saveLabel: 'Distribuir',
    onSave: async (el) => {
      const r = await RP.api(`/projetos/${proj.contrato.id}/distribuir`, { method: 'POST', body: {
        atividade_id: +RP.$('#x-a', el).value, pessoa_id: RP.$('#x-p', el).value ? +RP.$('#x-p', el).value : null,
        somente_sem_responsavel: RP.$('#x-v', el).checked, salvar_regra: RP.$('#x-r', el).checked } });
      RP.toast(`${r.atualizadas} atividade(s) enviadas`);
      await abrir(proj.contrato.id);
    },
  });
}
</script>
